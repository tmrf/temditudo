<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Premium de Vistoria</title>
    <!-- Tailwind CSS para Estilização Moderna -->
    <script src="https://tailwindcss.com"></script>
    <!-- Google Fonts (Inter) -->
    <link href="https://googleapis.com" rel="stylesheet">
    <!-- FontAwesome para Ícones Modernos -->
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        .step-content { display: none; }
        .step-content.active { display: block; animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4 antialiased">

    <div class="w-full max-w-md bg-slate-800 border border-slate-700/50 rounded-2xl shadow-2xl p-6 backdrop-blur-lg">
        
        <!-- Header Dinâmico (Estilo Vexsoft) -->
        <div class="text-center mb-6">
            <div class="inline-flex p-3 bg-blue-600/10 text-blue-400 rounded-xl mb-3">
                <i class="fa-solid fa-clipboard-check text-2xl"></i>
            </div>
            <h2 class="text-xl font-bold tracking-tight text-white">Checklist Digital</h2>
            <p class="text-xs text-slate-400 mt-1">Inspeção obrigatória em tempo real</p>
        </div>

        <!-- Indicador de Status do GPS -->
        <div id="gps-status" class="flex items-center justify-center gap-2 p-3 rounded-xl text-xs font-semibold mb-6 bg-rose-500/10 text-rose-400 border border-rose-500/20 transition-all">
            <i class="fa-solid fa-circle-notch animate-spin"></i>
            <span>Aguardando sinal estável do GPS...</span>
        </div>

        <!-- Formulário Multifases -->
        <form id="vistoriaForm" class="space-y-6">
            
            <!-- ETAPA 1: Identificação -->
            <div id="step1" class="step-content active space-y-4">
                <div class="space-y-1">
                    <label class="text-xs font-semibold text-slate-300 uppercase tracking-wider">Identificação do Condutor</label>
                    <div class="relative">
                        <i class="fa-solid fa-user absolute left-4 top-3.5 text-slate-500 text-sm"></i>
                        <input type="text" id="nomeInput" placeholder="NOME COMPLETO DO MOTORISTA" class="w-full bg-slate-900/50 border border-slate-700 rounded-xl py-3 pl-11 pr-4 text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 uppercase font-medium text-sm transition-all" required>
                    </div>
                </div>

                <div class="space-y-1">
                    <label class="text-xs font-semibold text-slate-300 uppercase tracking-wider">Dados do Carro</label>
                    <div class="relative">
                        <i class="fa-solid fa-car absolute left-4 top-3.5 text-slate-500 text-sm"></i>
                        <input type="text" id="placaInput" placeholder="PLACA DO VEÍCULO (ABC1D23)" maxlength="7" class="w-full bg-slate-900/50 border border-slate-700 rounded-xl py-3 pl-11 pr-4 text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 uppercase font-mono tracking-widest text-sm transition-all" required>
                    </div>
                </div>

                <button type="button" onclick="proximaEtapa(2)" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3.5 rounded-xl shadow-lg shadow-blue-600/20 active:scale-[0.99] transition-all flex items-center justify-center gap-2 mt-4">
                    Avançar para Mídias <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>
            </div>

            <!-- ETAPA 2: Fotos e Vídeos -->
            <div id="step2" class="step-content space-y-5">
                
                <!-- Box de Captura de Foto -->
                <div class="bg-slate-900/40 p-4 border border-slate-700/60 rounded-xl text-center space-y-3">
                    <div class="text-left">
                        <span class="text-xs font-semibold text-slate-300 uppercase tracking-wider block">1. Registro Fotográfico</span>
                        <span class="text-[11px] text-slate-400 block">Enquadre a frente e lateral do veículo de forma clara.</span>
                    </div>
                    <label for="fotoInput" class="w-full py-4 bg-slate-800 hover:bg-slate-700 border-2 border-dashed border-slate-600 hover:border-blue-500 rounded-xl cursor-pointer flex flex-col items-center justify-center gap-2 group transition-all">
                        <i class="fa-solid fa-camera text-slate-400 group-hover:text-blue-400 text-xl transition-colors"></i>
                        <span class="text-xs font-medium text-slate-300" id="fotoLabel">Tirar Foto do Carro</span>
                    </label>
                    <input type="file" id="fotoInput" accept="image/*" capture="camera" class="hidden" required>
                    <img id="fotoPreview" class="w-full h-32 object-cover rounded-lg hidden border border-slate-700" alt="Preview">
                </div>

                <!-- Box de Captura de Vídeo -->
                <div class="bg-slate-900/40 p-4 border border-slate-700/60 rounded-xl text-center space-y-3">
                    <div class="text-left">
                        <span class="text-xs font-semibold text-slate-300 uppercase tracking-wider block">2. Gravação de Vídeo</span>
                        <span class="text-[11px] text-slate-400 block">Faça um contorno contínuo de 360° ao redor do carro.</span>
                    </div>
                    <label for="videoInput" class="w-full py-4 bg-slate-800 hover:bg-slate-700 border-2 border-dashed border-slate-600 hover:border-purple-500 rounded-xl cursor-pointer flex flex-col items-center justify-center gap-2 group transition-all">
                        <i class="fa-solid fa-video text-slate-400 group-hover:text-purple-400 text-xl transition-colors"></i>
                        <span class="text-xs font-medium text-slate-300" id="videoLabel">Gravar Vídeo de 360°</span>
                    </label>
                    <input type="file" id="videoInput" accept="video/*" capture="camera" class="hidden" required>
                    <video id="videoPreview" class="w-full h-32 bg-black rounded-lg hidden border border-slate-700" controls></video>
                </div>

                <!-- Botões de Navegação -->
                <div class="grid grid-cols-3 gap-3 mt-4">
                    <button type="button" onclick="proximaEtapa(1)" class="bg-slate-700 hover:bg-slate-600 text-slate-200 font-semibold py-3.5 rounded-xl text-sm transition-all">
                        Voltar
                    </button>
                    <button type="submit" id="btnEnviar" class="col-span-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-emerald-600/20 active:scale-[0.99] transition-all flex items-center justify-center gap-2 disabled:bg-slate-700 disabled:text-slate-400 disabled:cursor-not-allowed" disabled>
                        <i class="fa-solid fa-cloud-arrow-up"></i> Finalizar Vistoria
                    </button>
                </div>
            </div>

            <!-- Dados Invisíveis de Geolocalização -->
            <input type="hidden" id="latitude">
            <input type="hidden" id="longitude">
        </form>

        <div id="gps-info" class="text-[10px] text-slate-500 font-mono text-center mt-6 tracking-wide"></div>
    </div>

    <script>
        const gpsStatus = document.getElementById('gps-status');
        const btnEnviar = document.getElementById('btnEnviar');
        const latInput = document.getElementById('latitude');
        const lonInput = document.getElementById('longitude');
        const gpsInfo = document.getElementById('gps-info');

        // Navegação entre fases da interface
        function proximaEtapa(numEtapa) {
            if (numEtapa === 2) {
                const nome = document.getElementById('nomeInput').value.trim();
                const placa = document.getElementById('placaInput').value.trim();
                if (!nome || !placa) {
                    alert("Por favor, preencha o Nome e a Placa antes de avançar.");
                    return;
                }
            }
            document.querySelectorAll('.step-content').forEach(el => el.classList.remove('active'));
            document.getElementById(`step${numEtapa}`).classList.add('active');
        }

        // Monitoramento nativo de Geolocalização
        function obterLocalizacao() {
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(
                    (position) => {
                        latInput.value = position.coords.latitude;
                        lonInput.value = position.coords.longitude;
                        gpsStatus.innerHTML = '<i class="fa-solid fa-circle-check text-sm text-emerald-400"></i> <span class="text-emerald-400">GPS Conectado em Tempo Real</span>';
                        gpsStatus.className = "flex items-center justify-center gap-2 p-3 rounded-xl text-xs font-semibold mb-6 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 transition-all";
                        gpsInfo.textContent = `COORDENADAS: LAT ${position.coords.latitude.toFixed(5)} | LON ${position.coords.longitude.toFixed(5)}`;
                        btnEnviar.disabled = false;
                    },
                    (error) => {gpsStatus.innerHTML = ' Localização Obrigatória Bloqueada';
gpsStatus.className = "flex items-center justify-center gap-2 p-3 rounded-xl text-xs font-semibold mb-6 bg-rose-500/10 text-rose-400 border border-rose-500/20 transition-all";
btnEnviar.disabled = true;
},
{ enableHighAccuracy: true }
);
}
}
window.onload = obterLocalizacao;
// Gerenciador e Feedbacks Visuais de Upload (Foto)
document.getElementById('fotoInput').addEventListener('change', function(e) {
const files = e.target.files;
if (files && files.length > 0) {
document.getElementById('fotoLabel').textContent = "Foto Capturada ✓";
const preview = document.getElementById('fotoPreview');
preview.src = URL.createObjectURL(files[0]);
preview.classList.remove('hidden');
}
});
// Gerenciador e Feedbacks Visuais de Upload (Vídeo)
document.getElementById('videoInput').addEventListener('change', function(e) {
const files = e.target.files;
if (files && files.length > 0) {
document.getElementById('videoLabel').textContent = "Vídeo Gravado ✓";
const preview = document.getElementById('videoPreview');
preview.src = URL.createObjectURL(files[0]);
preview.classList.remove('hidden');
}
});
// Integração de Envio corrigida para capturar o arquivo único binário (.files[0])
document.getElementById('vistoriaForm').addEventListener('submit', async function(e) {
e.preventDefault();
const btn = document.getElementById('btnEnviar');
btn.disabled = true;
btn.innerHTML = ' Processando Mídias...';
const toBase64 = file => new Promise((resolve, reject) => {
const reader = new FileReader();
reader.readAsDataURL(file);
reader.onload = () => {
const resultParts = reader.result.split(',');
resolve(resultParts[1]); // Pega apenas a string Base64 limpa
};
reader.onerror = error => reject(error);
});
try {
const fotoInputEl = document.getElementById('fotoInput');
const videoInputEl = document.getElementById('videoInput');
if (fotoInputEl.files.length === 0 || videoInputEl.files.length === 0) {
throw new Error("Você precisa capturar a foto e o vídeo antes de enviar.");
}
const fotoObj = fotoInputEl.files[0];
const videoObj = videoInputEl.files[0];
const dadosParaEnviar = {
nome: document.getElementById('nomeInput').value,
placa: document.getElementById('placaInput').value,
latitude: latInput.value,
longitude: lonInput.value,
fotoTipo: fotoObj.type,
fotoData: await toBase64(fotoObj),
videoTipo: videoObj.type,
videoData: await toBase64(videoObj)
};
// COLE A SUA URL DO SEU GOOGLE APPS SCRIPT AQUI
                const URL_GOOGLE_SCRIPT = "https://script.google.com/macros/s/AKfycbzicUtYk2nJf4ER2NojH2Pb9QajC_MZAgHqHYPlxjAysGR2G6F64qSFuRC2LO7jp70VOw/exec";
const resposta = await fetch(URL_GOOGLE_SCRIPT, {
method: "POST",
body: JSON.stringify(dadosParaEnviar)
});
const resultado = await resposta.json();
if(resultado.status === "sucesso") {
alert("✅ Inspeção concluída e enviada com sucesso!");
window.location.reload();
} else {
throw new Error(resultado.mensagem);
}
} catch (erro) {
alert("❌ Falha crítica no envio: " + erro.message);
btn.disabled = false;
btn.innerHTML = ' Finalizar Vistoria';
}
});
